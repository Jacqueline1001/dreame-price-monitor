name: Price Monitor Daily

on:
  schedule:
    # 每天 02:00 UTC = 北京 10:00
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run price monitor
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          SORFTIME_KEY: ${{ secrets.SORFTIME_KEY }}
        run: python price_monitor.py --config config_amazon.json --db price_history.db

      - name: Commit and push updated data + dashboard
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dashboard_data.json dashboard.html || true
          if ! git diff --staged --quiet; then
            git commit -m "Update price data - $(date -u +%Y-%m-%d)"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
